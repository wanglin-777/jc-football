# GitHub Actions: 每 4 小时自动更新竞彩预测网站
# 流程: 定时/手动/推送触发 -> 抓取官方数据并生成静态网站 -> 部署到 GitHub Pages
name: 定时更新竞彩预测

on:
  schedule:
    # 每 4 小时一次(用第 17 分钟错峰, 避免整点高峰排队)
    - cron: '17 */4 * * *'
  workflow_dispatch:          # 支持手动触发一次
  push:
    branches: [ main ]        # 每次推送也自动更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成静态网站(自动抓取竞彩数据: 官方->500网兜底)
        run: python build_site.py
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
